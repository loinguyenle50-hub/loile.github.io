name: GitLab contributions

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GITLAB_USER: loinguyenle50-hub          # your GitLab username
  GITLAB_HOST: https://gitlab.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render chart
        run: python3 scripts/gitlab_contrib.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gitlab-contributions.svg
          git diff --cached --quiet || git commit -m "update gitlab contributions"
          git push
