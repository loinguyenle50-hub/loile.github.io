<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ffb2"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
  <radialGradient id="glow" cx="0.2" cy="0.4" r="0.6"><stop offset="0" stop-color="#00ffb2" stop-opacity="0.16"/><stop offset="1" stop-color="#00ffb2" stop-opacity="0"/></radialGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ffb2" stop-opacity="0"/><stop offset="0.5" stop-color="#00ffb2" stop-opacity="0.10"/><stop offset="1" stop-color="#00ffb2" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
  <clipPath id="card"><rect x="1" y="1" width="878" height="288" rx="16"/></clipPath>
</defs>
<style>
.role{animation:cycle 9s infinite}
@keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}30%{opacity:1;transform:translateY(0)}34%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.scan{animation:sweep 7s linear infinite}
@keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}
.f1{animation:float 5s ease-in-out infinite}
.f2{animation:float 6.5s ease-in-out infinite -2s}
.f3{animation:float 4.5s ease-in-out infinite -1s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
</style>
<rect x="1" y="1" width="878" height="288" rx="16" fill="#0d1117"/>
<g clip-path="url(#card)">
  <rect width="880" height="290" fill="url(#grid)"/>
  <rect width="880" height="290" fill="url(#glow)"/>
  <rect class="scan" x="0" y="0" width="200" height="290" fill="url(#scan)"/>
  <text x="610" y="215" font-size="170" font-weight="800" fill="#00ffb2" opacity="0.05">&lt;/&gt;</text>
  <g class="f1"><rect x="700" y="52" width="14" height="14" rx="3" fill="none" stroke="#00ffb2" stroke-opacity="0.5"/></g>
  <g class="f2"><circle cx="790" cy="88" r="6" fill="#7c5cff" fill-opacity="0.7"/></g>
  <g class="f3"><rect x="820" y="180" width="10" height="10" rx="2" fill="#00ffb2" fill-opacity="0.5" transform="rotate(20 825 185)"/></g>
  <rect x="0" y="286" width="880" height="3" fill="url(#g)"/>
</g>
<rect x="1" y="1" width="878" height="288" rx="16" fill="none" stroke="#30363d"/>
<circle class="pulse" cx="42" cy="46" r="4" fill="#00ffb2"/>
<text x="56" y="50" font-size="12" fill="#7d8590">online / ho chi minh city, vn</text>
<text x="34" y="150" font-size="92" font-weight="800" fill="#00ffb2" opacity="0.35" filter="url(#blur)">loidev</text>
<text x="34" y="150" font-size="92" font-weight="800" fill="url(#g)">loidev</text>
<text class="role" x="38" y="196" font-size="24" fill="#e6edf3" style="animation-delay:0s"><tspan fill="#00ffb2">&gt; </tspan>mobile apps<tspan class="cur" fill="#00ffb2">_</tspan></text>
<text class="role" x="38" y="196" font-size="24" fill="#e6edf3" style="opacity:0;animation-delay:3s"><tspan fill="#00ffb2">&gt; </tspan>landing pages &amp; e-commerce<tspan class="cur" fill="#00ffb2">_</tspan></text>
<text class="role" x="38" y="196" font-size="24" fill="#e6edf3" style="opacity:0;animation-delay:6s"><tspan fill="#00ffb2">&gt; </tspan>learning devops + design<tspan class="cur" fill="#00ffb2">_</tspan></text>

<text x="38" y="250" font-size="12" fill="#7d8590">react · next.js · fastify · flutter · rust · docker</text>
</svg>